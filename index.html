<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F1F2EE" />
    <meta name="color-scheme" content="light dark" />
    <!-- set the theme before first paint: stored choice, else the system setting -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('sk-theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0E0F11');
      })();
    </script>
    <title>Sanika Khanduja · Software Engineer</title>
    <meta name="description" content="Software engineer. Interned at Microsoft ’26 and Cisco ’25. Open to full-time software engineering roles from June 2027." />

    <!-- Link preview (LinkedIn, Slack, ATS). TODO on first deploy: make og:image and og:url absolute with the live domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sanika Khanduja · Software Engineer" />
    <meta property="og:description" content="Interned at Microsoft ’26 and Cisco ’25. Open to full-time software engineering roles from June 2027." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sanika Khanduja. Interned at Microsoft ’26 and Cisco ’25. Open to full-time SWE roles from June 2027." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
